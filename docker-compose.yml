services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pma_app
    restart: always
    working_dir: /app
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: pma
      DB_USERNAME: pma_user
      DB_PASSWORD: pma_password
    volumes:
      - .:/app
    networks:
      - pma_network
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11.4
    container_name: pma_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pma
      MYSQL_USER: pma_user
      MYSQL_PASSWORD: pma_password
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - pma_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 20s
      retries: 10
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: pma_nginx
    restart: always
    ports:
      - "8000:80"
    volumes:
      - .:/app
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pma_network
    depends_on:
      - app

volumes:
  mariadb_data:
    driver: local

networks:
  pma_network:
    driver: bridge
